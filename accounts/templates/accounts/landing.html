<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ role_label }} - SCMS</title>
</head>
<body>
  <header>
    <p>Signed in as {{ user.full_name }} ({{ role_label }})</p>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  </header>
  <h1>{{ role_label }} home</h1>
  {% if user.role == "ADMIN" %}
  <nav>
    <ul>
      <li><a href="{% url 'accounts:admin_departments' %}">Departments</a></li>
      <li><a href="{% url 'accounts:admin_locations' %}">Locations</a></li>
    </ul>
  </nav>
  {% endif %}
  <p>Your SCMS functions will appear here as they are built.</p>
</body>
</html>
