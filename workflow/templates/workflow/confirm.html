{% extends "ui/base.html" %}
{% block title %}Confirm resolution — SCMS{% endblock %}
{% block content %}
<h1>Confirm resolution</h1>
  <p>Confirmation closes complaint {{ complaint_id }}. Rating is optional.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Confirm and close</button>
  </form>
{% endblock %}
