name: SCMS unified verification

on:
  pull_request:
    branches: [Main, 'integration/**', 'feature/**', 'fix/**']
  push:
    branches: [Main]
  workflow_dispatch:
    inputs:
      require_f4:
        description: 'Require all F4-dependent integration checks (fails if unavailable)'
        type: boolean
        default: false


permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCMS_CI_DATABASE_ISOLATED: '1'
      SCMS_CI_REQUIRE_F4: ${{ inputs.require_f4 && '1' || '0' }}
      DJANGO_SECRET_KEY: synthetic-ci-recovery-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: System, migration, process-crash tests and module coverage
        run: sh scripts/ci_checks.sh build/evidence/b10-q05-recovery
      - name: Retain sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b10-q05-recovery-evidence
          path: build/evidence/b10-q05-recovery/
          if-no-files-found: error

  postgresql-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: scms_recovery
          POSTGRES_USER: scms_recovery
          POSTGRES_PASSWORD: synthetic-isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scms_recovery -d scms_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SCMS_CI_DATABASE_ISOLATED: '1'
      SCMS_CI_REQUIRE_F4: ${{ inputs.require_f4 && '1' || '0' }}
      DJANGO_SECRET_KEY: synthetic-ci-recovery-test-only
      DJANGO_SETTINGS_MODULE: scms.recovery_postgresql_settings
      RECOVERY_POSTGRES_NAME: scms_recovery
      RECOVERY_POSTGRES_USER: scms_recovery
      RECOVERY_POSTGRES_PASSWORD: synthetic-isolated-ci-only
      RECOVERY_POSTGRES_HOST: 127.0.0.1
      RECOVERY_POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install recovery test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt 'psycopg[binary]==3.3.8'
      - name: Full PostgreSQL regression, explicit integrations and coverage
        run: sh scripts/ci_checks.sh build/evidence/b10-q05-postgresql
      - name: PostgreSQL assignment lock and authorization regression
        run: |
          set -o pipefail
          python -m pytest integration_checks/allocation_concurrency_pg.py --no-cov -q \
            --junitxml=build/evidence/b10-q05-postgresql/allocation-concurrency.xml \
            | tee build/evidence/b10-q05-postgresql/allocation-concurrency.txt
      - name: Retain PostgreSQL recovery component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b10-q05-postgresql-evidence
          path: build/evidence/b10-q05-postgresql/
          if-no-files-found: error
